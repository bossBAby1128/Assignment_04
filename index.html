<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- tailwind+daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- google-fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <title>AssignMent-04</title>
    <!-- <link rel="shortcut icon" href="./pictures/logo.png"> -->
    <!-- icons -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style> -->
    <style>
      *{
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-b-2 border-gray-300 bg-slate-50 sticky top-0 bg-base-200 z-10">
        <div class="mx-auto w-full max-w-5xl px-4 py-6">
            <h1 class="text-[32px] font-bold text-navy">Job Application Tracker</h1>
        </div>
    </header>

    <main class="mx-auto w-full max-w-[1110px] px-4 py-[60px]">
        <!-- Dashboard -->
        <section class="mt-3 grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div class="card border border-slate-200 bg-white px-5 py-4">
                <p class="text-sm text-slate-800">Total</p>
                <p id="total-count" class="mt-1 text-3xl font-bold text-blue-900">0</p>
            </div>
            <div class="card border border-slate-200 bg-white px-5 py-4">
                <p class="text-sm text-slate-800">Interview</p>
                <p id="interview-count" class="mt-1 text-3xl font-bold text-emerald-500">0</p>
            </div>
            <div class="card border border-slate-200 bg-white px-5 py-4">
                <p class="text-sm text-slate-800">Rejected</p>
                <p id="rejected-count" class="mt-1 text-3xl font-bold text-red-500">0</p>
            </div>
        </section>

        <div class="divider my-7"></div>

        <!-- Available Jobs -->
        <section>
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-semibold text-navy">Available Jobs</h2>
                <span id="jobs-count" class="text-slate-500"></span>
            </div>

            <div class="mb-4 mt-4 flex flex-wrap gap-2">
                <button class="tab-btn btn btn-sm border-slate-200 bg-white text-xs font-normal normal-case text-slate-600" data-tab="all">All</button>
                <button class="tab-btn btn btn-sm border-slate-200 bg-white text-xs font-normal normal-case text-slate-600" data-tab="interview">Interview</button>
                <button class="tab-btn btn btn-sm border-slate-200 bg-white text-xs font-normal normal-case text-slate-600" data-tab="rejected">Rejected</button>
            </div>

            <div id="jobs-container" class="flex flex-col gap-4"></div>

        
        <div id="empty-state" class="hidden">
            <div class="card min-h-100 items-center justify-center border border-slate-200 bg-white px-4 text-center">
                <img src="./pictures/assignment_7959593 1.png" alt="">
                <h3 class="mt-5 text-2xl font-bold text-navy">No jobs available</h3>
                <p class="mt-1 text-slate-500">Check back soon for new job opportunities</p>
            </div>
        </div>
    </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
